# ─────────────────────────────────────────────────────────────────────────────
# What to watch. Add as many products as you like – one block each.
# Paste the product page URL from the shop. After editing, commit the file.
#
#   name:  anything you like – it's the notification title
#   url:   the exact product page (or a search/category page for text_appears)
#   mode:  (optional) "text_appears" = alert when any watch_text shows up on the
#          page. Great for products that aren't listed yet – point it at a
#          search results page.
#   in_stock_text / out_of_stock_text: (optional) exact phrases on that page,
#          if the automatic detection gets it wrong (check with --test).
#   enabled: false  = temporarily ignore this entry
# ─────────────────────────────────────────────────────────────────────────────

check_interval_seconds: 30   # how often each product is checked while running

products:
  # 1) A product page that already exists but is "coming soon"/out of stock.
  #    Pokémon Center also shows a queue page on big drops – that triggers an
  #    alert too ("QUEUE IS OPEN").
  - name: "Pokémon Center UK - Delta Reign Elite Trainer Box"
    url: "https://www.pokemoncenter.com/product/10-10438-112"
    enabled: true
  - name: "Smyths - Pokémon Trading Card Game (TCG): 30th Celebration Ultra-Premium Collection Day Edition"
    url: "https://www.smythstoys.com/uk/en-gb/toys/action-figures-and-playsets/pokemon-toys/pokemon-trading-card-game-tcg/pokemon-trading-card-game-tcg-30th-celebration-ultra-premium-collection-day-edition/p/264502"
    enabled: true
  - name: "Smyths - Pokémon Trading Card Game (TCG): 30th Celebration Ultra-Premium Collection Night Edition"
    url: "https://www.smythstoys.com/uk/en-gb/toys/action-figures-and-playsets/pokemon-toys/pokemon-trading-card-game-tcg/pokemon-trading-card-game-tcg-30th-celebration-ultra-premium-collection-night-edition/p/264513"
    enabled: true
  - name: "Argos – REPLACE ME"
    url: "https://www.argos.co.uk/product/REPLACE-ME"
    enabled: false

  - name: "GAME – REPLACE ME"
    url: "https://www.game.co.uk/en/REPLACE-ME"
    enabled: false

  # 2) Product not listed anywhere yet? Watch a search page for its name.
  - name: "Pokemon Centre Delta Reign Booster Box Stocked"
    url: "https://www.pokemoncenter.com/product/10-10439-109"
    mode: text_appears
    watch_text: ["Delta"]
    enabled: true
    
  - name: "Pokemon Centre Delta Reign ETB Stocked"
    url: "https://www.pokemoncenter.com/product/10-10438-112"
    mode: text_appears
    watch_text: ["Delta"]
    enabled: true
    
  - name: "Pokemon Centre Delta Reign Booster bundle"
    url: "https://www.pokemoncenter.com/product/10-10446-120"
    mode: text_appears
    watch_text: ["Delta"]
    enabled: true
